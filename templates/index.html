<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat vs Dog Classifier</title>
    <!-- Bootstrap CSS exactly as in the tutorial -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <style>
        body {
            /* Exact gradient and font from the instructor's screen */
            background: linear-gradient(135deg, #1b2d6b, #4f83cc);
            color: #fff;
            font-family: "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .upload-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Logo Animation */
        .animated-logo {
            width: 120px;
            margin-bottom: 20px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="upload-card">
                
                <!-- Put your logo.png inside the "static" folder -->
                <img src="/static/logo.png" alt="App Logo" class="animated-logo">
                
                <h2 class="mb-4 fw-bold">Cat vs Dog Classifier</h2>
                
                <!-- The form that sends the image to your Flask app.py -->
                <form action="/predict" method="POST" enctype="multipart/form-data">
                    <div class="mb-4">
                        <input class="form-control" type="file" name="file" id="imageFile" accept="image/*" required>
                    </div>
                    <img id="imagePreview" src="#" alt="Image Preview" style="display: none; max-width: 100%; border-radius: 10px; margin-top: 15px; margin-bottom: 15px;" />
                    <button type="submit" class="btn btn-warning w-100 fw-bold fs-5 rounded-pill">Classify Image</button>
                </form>

                <!-- Flask will inject the prediction result here -->
                {% if prediction %}
                    <div class="mt-4 alert alert-light text-dark shadow-sm rounded-pill">
                        <h4 class="mb-0">Result: <strong>{{ prediction }}</strong></h4>
                    </div>
                {% endif %}

            </div>
        </div>
    </div>
</div>
<script>
  const fileInput = document.getElementById('imageFile');
  const imagePreview = document.getElementById('imagePreview');

  fileInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
          const reader = new FileReader();
          reader.addEventListener('load', function() {
              imagePreview.setAttribute('src', this.result);
              imagePreview.style.display = 'block';
          });
          reader.readAsDataURL(file);
      } else {
          imagePreview.style.display = 'none';
      }
  });
</script>

</body>
</html>
